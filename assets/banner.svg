<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <title>Sup, im Dolan</title>
  <desc>Dark terminal banner. Line one types Sup, im Dolan and a hand waves. Line two types I LIKE TO EAT COMPLETOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0e"/>
      <stop offset="0.48" stop-color="#0c1412"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#134e3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#134e3a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="1000" height="4" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1.2" fill="#000000" opacity="0.28"/>
    </pattern>
  </defs>
  <style><![CDATA[
    .chrome {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      fill: #8ea0b5;
    }
    .prompt, .cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 36px;
    }
    .prompt { fill: #5eead4; }
    .cmd { fill: #b8f7cf; }
    .t1, .t2 { clip-path: inset(0 100% 0 0); }
    .t1 { animation: reveal 1.56s steps(13, end) 0.35s forwards; }
    .t2 { animation: reveal 2.3s steps(23, end) 2.25s forwards; }
    @keyframes reveal { to { clip-path: inset(0 0% 0 0); } }
    .cur {
      fill: #b8f7cf;
      animation: blink 1.05s step-end infinite;
    }
    .cur1 {
      animation: slide1 1.56s steps(13, end) 0.35s forwards, blink 1.05s step-end infinite, bye 0.01s linear 2.05s forwards;
    }
    .cur2 {
      visibility: hidden;
      animation: hi 0.01s linear 2.25s forwards, slide2 2.3s steps(23, end) 2.25s forwards, blink 1.05s step-end infinite;
    }
    @keyframes slide1 { to { transform: translateX(286px); } }
    @keyframes slide2 { to { transform: translateX(506px); } }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes bye { to { visibility: hidden; } }
    @keyframes hi { to { visibility: visible; } }
    .wave {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: 0;
      animation: pop 0.18s ease-out 2.05s forwards, sway 0.72s ease-in-out 2.12s infinite;
    }
    @keyframes pop { to { opacity: 1; } }
    @keyframes sway {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-16deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t2 { animation: none; clip-path: none; }
      .cur1 { animation: none; visibility: hidden; }
      .cur2 { animation: none; visibility: visible; transform: translateX(506px); }
      .wave { animation: none; opacity: 1; }
    }
  ]]></style>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#bloom)"/>
  <rect width="1000" height="220" fill="url(#scan)" opacity="0.45"/>
  <rect width="1000" height="40" fill="url(#bar)"/>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#243140" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6" fill="#28c840"/>
  <text class="chrome" x="500" y="25" text-anchor="middle">dolan@lascabras: ~</text>
  <text class="prompt" x="32" y="96">$</text>
  <text class="prompt" x="32" y="156">$</text>
  <!-- 13 glyphs * 22px = 286; 23 glyphs * 22px = 506. Clip steps match the cursor travel. -->
  <text class="cmd t1" x="68" y="96" textLength="286" lengthAdjust="spacingAndGlyphs">Sup, im Dolan</text>
  <text class="cmd t2" x="68" y="156" textLength="506" lengthAdjust="spacingAndGlyphs">I LIKE TO EAT COMPLETOS</text>
  <rect class="cur cur1" x="68" y="68" width="12" height="30" rx="1"/>
  <rect class="cur cur2" x="68" y="128" width="12" height="30" rx="1"/>
  <g transform="translate(368,44)">
    <g class="wave">
      <g fill="#f3c19a" stroke="#c98462" stroke-width="1.3" stroke-linejoin="round">
        <rect x="66" y="48" width="8" height="8" fill="#f3c19a" opacity="0" stroke="none"/>
        <rect x="15" y="16" width="7" height="26" rx="3.5" transform="rotate(-12 18.5 42)" stroke="#c98462"/>
        <rect x="25" y="6" width="7.2" height="34" rx="3.6" transform="rotate(-2 28.6 40)" stroke="#c98462"/>
        <rect x="35.5" y="9" width="7" height="30" rx="3.5" transform="rotate(8 39 40)" stroke="#c98462"/>
        <rect x="45" y="18" width="6.4" height="22" rx="3.2" transform="rotate(16 48 40)" stroke="#c98462"/>
        <rect x="14" y="36" width="38" height="20" rx="10" stroke="#c98462"/>
        <path d="M13 42c-9 1-14 8-11.5 14 2 5 8 7 13 4 3.6-2.2 5.4-6.4 4.3-11-1-3.8-2.8-6-5.8-7z" stroke="#c98462"/>
        <path d="M24 52h16c1.5 5 1.2 10-1.2 14H25.2c-2.4-4-2.5-9-1.2-14z" stroke="none"/>
      </g>
      <path d="M22 40c7 2.5 16 2.5 24 0" fill="none" stroke="#d3926a" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M20 47c8 3 18 3 27 0" fill="none" stroke="#d3926a" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
