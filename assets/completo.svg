<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">I LIKE TO EAT COMPLETOS</title>
  <desc id="desc">A cute animated Chilean completo: golden bun, red-brown vienesa, mashed palta, diced tomato, and a zigzag of mayonnaise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C79A"/>
      <stop offset="38%" stop-color="#FFF6EA"/>
      <stop offset="72%" stop-color="#FFE3C2"/>
      <stop offset="100%" stop-color="#E7B15C"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3AC62"/>
      <stop offset="100%" stop-color="#C4843C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FFE7C4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFE7C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7A8"/>
      <stop offset="42%" stop-color="#F0B433"/>
      <stop offset="100%" stop-color="#D18416"/>
    </linearGradient>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3CC"/>
      <stop offset="55%" stop-color="#F6C453"/>
      <stop offset="100%" stop-color="#E39B24"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C14A"/>
      <stop offset="100%" stop-color="#C47C14"/>
    </linearGradient>
    <linearGradient id="sausage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A08A"/>
      <stop offset="28%" stop-color="#D25A42"/>
      <stop offset="70%" stop-color="#B4412E"/>
      <stop offset="100%" stop-color="#8A3124"/>
    </linearGradient>
    <linearGradient id="palta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5F08A"/>
      <stop offset="45%" stop-color="#7EBA45"/>
      <stop offset="100%" stop-color="#3E7C2C"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F3E2CC"/>
    </linearGradient>
  </defs>
  <style type="text/css"><![CDATA[
    .completo { animation: hop 2.6s ease-in-out infinite; }
    .shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: squat 2.6s ease-in-out infinite;
    }
    .mayo {
      transform-box: fill-box;
      transform-origin: center;
      animation: wobble 1.5s ease-in-out infinite;
    }
    .steam {
      fill: none;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: steam-rise 3s ease-in infinite;
    }
    .steam-a { stroke-width: 5; }
    .steam-b { stroke-width: 4; animation-duration: 3.5s; animation-delay: 0.85s; }
    .steam-c { stroke-width: 3.5; animation-duration: 2.7s; animation-delay: 1.6s; }
    .spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle 2.4s ease-in-out infinite;
    }
    .spark-b { animation-delay: 0.4s; animation-duration: 2.1s; }
    .spark-c { animation-delay: 1.1s; animation-duration: 2.8s; }
    .spark-d { animation-delay: 0.7s; animation-duration: 1.9s; }
    .spark-e { animation-delay: 1.5s; animation-duration: 2.6s; }
    .spark-f { animation-delay: 0.2s; animation-duration: 3s; }
    .caption {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.4px;
      fill: #6E3016;
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes squat {
      0%, 100% { transform: scaleX(1); opacity: 0.3; }
      50% { transform: scaleX(0.9); opacity: 0.16; }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-2.2deg) translateY(0); }
      30% { transform: rotate(2deg) translateY(1px) skewX(1.4deg); }
      60% { transform: rotate(2.6deg) translateY(-1.5px); }
      80% { transform: rotate(-1.4deg) skewX(-1.2deg); }
    }
    @keyframes steam-rise {
      0% { transform: translateY(8px) scale(0.8); opacity: 0; }
      18% { opacity: 0.75; }
      100% { transform: translateY(-58px) scale(1.12); opacity: 0; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.35) rotate(0deg); }
      45% { opacity: 1; transform: scale(1) rotate(18deg); }
      70% { opacity: 0.15; transform: scale(0.55) rotate(28deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .completo, .shadow, .mayo, .steam, .spark { animation: none; }
      .steam { opacity: 0.45; }
      .spark { opacity: 0.85; }
      .shadow { opacity: 0.28; }
    }
  ]]></style>

