<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc" stroke-linecap="round" stroke-linejoin="round">
  <title id="title">I LIKE TO EAT COMPLETOS</title>
  <desc id="desc">A cartoon red vienesa sleeps in a tan hot-dog bun, clutching a wavy green mashed-palta blanket dotted with tomato dice and a zigzag of mayonnaise.</desc>
  <defs>
    <filter id="softShadow" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>
  <style type="text/css"><![CDATA[
    .sleeper {
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 4.4s ease-in-out infinite;
    }
    .mayo-shine {
      animation: shimmer 2.6s ease-in-out infinite;
    }
    .z {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #F6E8C8;
      stroke: #1A120E;
      stroke-linejoin: round;
      paint-order: stroke fill;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .z1 { font-size: 22px; stroke-width: 5px; animation: driftz 3.8s ease-in-out infinite; }
    .z2 { font-size: 30px; stroke-width: 5.5px; animation: driftz 3.8s ease-in-out infinite 1.25s; }
    .z3 { font-size: 40px; stroke-width: 6px; animation: driftz 3.8s ease-in-out infinite 2.5s; }
    .cap {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #F6E8C8;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes driftz {
      0% { transform: translate(0px, 8px) rotate(-12deg); opacity: 0; }
      16% { opacity: 1; }
      72% { opacity: 0.85; }
      100% { transform: translate(-28px, -74px) rotate(14deg); opacity: 0; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.95; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sleeper, .mayo-shine, .z { animation: none; }
      .mayo-shine { opacity: 0.55; }
      .z1, .z2 { opacity: 0.8; }
      .z3 { opacity: 0.95; }
    }
  ]]></style>

