<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <title>Current status</title>
  <desc>Four animated cards: a cyclist at Las Cabras, a trekking hiker, a cat with a wrench, and a boxer engine over a coupe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0e"/>
      <stop offset="0.5" stop-color="#0c1412"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0e1c28"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style><![CDATA[
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      fill: #e7eef8;
    }
    .spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rider {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bob 0.5s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2.5px); }
    }
    .speed { animation: dash 0.55s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .cloud {
      animation: drift 6.5s ease-in-out infinite;
    }
    .cloud.b { animation-duration: 9s; animation-delay: -3.2s; }
    @keyframes drift {
      0%, 100% { transform: translateX(-12px); }
      50% { transform: translateX(18px); }
    }
    .hiker {
      animation: trek 3.2s ease-in-out infinite;
    }
    @keyframes trek {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(14px, 6px); }
    }
    .leg {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: stride 0.62s ease-in-out infinite;
    }
    .leg.r { animation-delay: -0.31s; }
    @keyframes stride {
      0%, 100% { transform: rotate(24deg); }
      50% { transform: rotate(-24deg); }
    }
    .tail {
      transform-box: fill-box;
      transform-origin: 100% 80%;
      animation: swish 1.5s ease-in-out infinite;
    }
    @keyframes swish {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-22deg); }
    }
    .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 3.6s linear infinite;
    }
    @keyframes blink {
      0%, 40%, 48%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(0.12); }
    }
    .wrench {
      transform-box: fill-box;
      transform-origin: center;
      animation: turn 1.15s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(16deg); }
    }
    .glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2.3s ease-in-out infinite;
    }
    .glow.alt { animation-delay: -1.15s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.38; transform: scale(0.94); }
      50% { opacity: 0.95; transform: scale(1.1); }
    }
    .engine { animation: hover 3s ease-in-out infinite; }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .rider, .speed, .cloud, .hiker, .leg, .tail, .eyes, .wrench, .glow, .engine {
        animation: none;
      }
    }
  ]]></style>
  <rect width="1000" height="260" fill="url(#bg)"/>

